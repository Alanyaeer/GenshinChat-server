<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenshinChat WebSocket测试工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#7C3AED', // 原神紫色调
                        secondary: '#EC4899',
                        dark: '#1E293B',
                        light: '#F8FAFC'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .scrollbar-hide {
                scrollbar-width: none;
                -ms-overflow-style: none;
            }
            .scrollbar-hide::-webkit-scrollbar {
                display: none;
            }
            .shadow-glow {
                box-shadow: 0 0 15px rgba(124, 58, 237, 0.5);
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans text-gray-800">
<div class="container mx-auto px-4 py-8 max-w-6xl">
    <header class="mb-8 text-center">
        <h1 class="text-[clamp(1.8rem,4vw,2.5rem)] font-bold text-primary mb-2 flex items-center justify-center">
            <i class="fa fa-comments-o mr-3" aria-hidden="true"></i>
            GenshinChat WebSocket测试工具
        </h1>
        <p class="text-gray-600">测试WebSocket消息发送与心跳功能</p>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- 连接设置面板 -->
        <div class="lg:col-span-1 space-y-6">
            <div class="bg-white rounded-xl shadow-lg p-6 transition-all duration-300 hover:shadow-glow">
                <h2 class="text-xl font-semibold mb-4 flex items-center">
                    <i class="fa fa-cogs text-primary mr-2"></i>连接设置
                </h2>

                <div class="space-y-4">
                    <div>
                        <label for="wsUrl" class="block text-sm font-medium text-gray-700 mb-1">WebSocket地址</label>
                        <div class="flex">
                            <input type="text" id="wsUrl"
                                   class="flex-1 px-4 py-2 border border-gray-300 rounded-l-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all"
                                   value="ws://localhost:8081/v2/im/server?myId=test123">
                            <button id="connectBtn"
                                    class="bg-primary hover:bg-primary/90 text-white px-4 py-2 rounded-r-lg transition-all">
                                <i class="fa fa-plug mr-1"></i>连接
                            </button>
                        </div>
                    </div>

                    <div>
                        <label for="userId" class="block text-sm font-medium text-gray-700 mb-1">用户ID</label>
                        <input type="text" id="userId"
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all"
                               value="test123">
                    </div>

                    <div>
                        <label for="targetUserId" class="block text-sm font-medium text-gray-700 mb-1">目标用户ID</label>
                        <input type="text" id="targetUserId"
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all"
                               value="333">
                    </div>

                    <div class="flex items-center space-x-2">
                        <input type="checkbox" id="autoHeartbeat" checked
                               class="h-4 w-4 text-primary focus:ring-primary border-gray-300 rounded">
                        <label for="autoHeartbeat" class="text-sm text-gray-700">自动发送心跳</label>
                    </div>

                    <div id="connectionStatus" class="flex items-center p-3 bg-gray-100 rounded-lg">
                        <span id="statusIndicator" class="w-3 h-3 rounded-full bg-red-500 mr-2"></span>
                        <span id="statusText" class="text-sm">未连接</span>
                    </div>
                </div>
            </div>

            <!-- 消息类型设置 -->
            <div class="bg-white rounded-xl shadow-lg p-6 transition-all duration-300 hover:shadow-glow">
                <h2 class="text-xl font-semibold mb-4 flex items-center">
                    <i class="fa fa-envelope-o text-primary mr-2"></i>消息设置
                </h2>

                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">消息类型</label>
                        <div class="grid grid-cols-2 gap-2">
                            <button id="textMessageBtn" class="bg-primary text-white px-3 py-2 rounded-lg transition-all">
                                文本消息
                            </button>
                            <button id="heartbeatBtn" class="bg-gray-200 hover:bg-gray-300 px-3 py-2 rounded-lg transition-all">
                                心跳消息
                            </button>
                        </div>
                    </div>

                    <div>
                        <label for="compressType" class="block text-sm font-medium text-gray-700 mb-1">压缩类型</label>
                        <select id="compressType" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all">
                            <option value="0">无压缩</option>
                            <option value="1">GZIP</option>
                        </select>
                    </div>

                    <div>
                        <label for="codecType" class="block text-sm font-medium text-gray-700 mb-1">序列化类型</label>
                        <select id="codecType" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all">
                            <option value="0">PROTOSTUFF</option>
                            <option value="1">JSON</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- 消息发送与接收区域 -->
        <div class="lg:col-span-2 space-y-6">
            <!-- 消息显示区域 -->
            <div class="bg-white rounded-xl shadow-lg h-96 flex flex-col transition-all duration-300 hover:shadow-glow">
                <div class="p-4 border-b border-gray-200 flex justify-between items-center">
                    <h2 class="text-xl font-semibold flex items-center">
                        <i class="fa fa-comments text-primary mr-2"></i>消息日志
                    </h2>
                    <button id="clearLogs" class="text-gray-500 hover:text-gray-700 transition-colors">
                        <i class="fa fa-trash-o mr-1"></i>清空
                    </button>
                </div>

                <div id="messageLogs" class="flex-1 p-4 overflow-y-auto scrollbar-hide space-y-4">
                    <div class="text-gray-500 text-sm italic text-center">
                        连接后将显示消息日志...
                    </div>
                </div>
            </div>

            <!-- 消息输入区域 -->
            <div class="bg-white rounded-xl shadow-lg p-6 transition-all duration-300 hover:shadow-glow">
                <h2 class="text-xl font-semibold mb-4 flex items-center">
                    <i class="fa fa-pencil text-primary mr-2"></i>发送消息
                </h2>

                <div class="space-y-4">
                        <textarea id="messageInput" rows="4"
                                  class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all resize-none"
                                  placeholder="输入要发送的消息..."></textarea>

                    <div class="flex justify-end">
                        <button id="sendBtn" disabled
                                class="bg-gray-300 text-gray-500 cursor-not-allowed px-6 py-2 rounded-lg transition-all flex items-center">
                            <i class="fa fa-paper-plane mr-2"></i>发送消息
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="mt-12 text-center text-gray-500 text-sm">
        <p>基于GenshinChat项目的WebSocket测试工具 | 支持文本消息和心跳检测</p>
    </footer>
</div>

<script>
    // DOM元素
    const wsUrlInput = document.getElementById('wsUrl');
    const connectBtn = document.getElementById('connectBtn');
    const userIdInput = document.getElementById('userId');
    const targetUserIdInput = document.getElementById('targetUserId');
    const autoHeartbeatCheckbox = document.getElementById('autoHeartbeat');
    const statusIndicator = document.getElementById('statusIndicator');
    const statusText = document.getElementById('statusText');
    const messageLogs = document.getElementById('messageLogs');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const clearLogsBtn = document.getElementById('clearLogs');
    const textMessageBtn = document.getElementById('textMessageBtn');
    const heartbeatBtn = document.getElementById('heartbeatBtn');
    const compressTypeSelect = document.getElementById('compressType');
    const codecTypeSelect = document.getElementById('codecType');

    // 状态变量
    let websocket = null;
    let isConnected = false;
    let currentMessageType = 'text'; // 'text' 或 'heartbeat'
    let heartbeatInterval = null;

    // 协议常量 (与后端保持一致)
    const MESSAGE_TYPE = {
        TEXT: 1,
        PING: 2,
        PONG: 3,
        MEDIA: 4
    };

    const COMPRESS_TYPE = {
        NONE: 0,
        GZIP: 1
    };

    const CODEC_TYPE = {
        PROTOSTUFF: 0,
        JSON: 1
    };

    // 初始化事件监听
    function initEventListeners() {
        // 连接按钮
        connectBtn.addEventListener('click', toggleConnection);

        // 发送按钮
        sendBtn.addEventListener('click', sendMessage);

        // 清空日志
        clearLogsBtn.addEventListener('click', clearLogs);

        // 消息类型切换
        textMessageBtn.addEventListener('click', () => setMessageType('text'));
        heartbeatBtn.addEventListener('click', () => setMessageType('heartbeat'));

        // 自动心跳切换
        autoHeartbeatCheckbox.addEventListener('change', toggleAutoHeartbeat);

        // 按Enter发送消息
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // 用户ID变更时更新连接URL
        userIdInput.addEventListener('input', updateWsUrlWithUserId);
    }

    // 更新WebSocket URL中的用户ID
    function updateWsUrlWithUserId() {
        const currentUrl = wsUrlInput.value;
        const userId = userIdInput.value.trim();

        if (!currentUrl || !userId) return;

        // 解析并更新URL中的myId参数
        try {
            const url = new URL(currentUrl);
            url.searchParams.set('myId', userId);
            wsUrlInput.value = url.toString();
        } catch (e) {
            console.error('无法解析URL:', e);
        }
    }

    // 设置消息类型
    function setMessageType(type) {
        currentMessageType = type;

        if (type === 'text') {
            textMessageBtn.classList.remove('bg-gray-200', 'hover:bg-gray-300');
            textMessageBtn.classList.add('bg-primary', 'text-white');
            heartbeatBtn.classList.remove('bg-primary', 'text-white');
            heartbeatBtn.classList.add('bg-gray-200', 'hover:bg-gray-300');
            messageInput.disabled = false;
            messageInput.placeholder = '输入要发送的消息...';
        } else {
            textMessageBtn.classList.remove('bg-primary', 'text-white');
            textMessageBtn.classList.add('bg-gray-200', 'hover:bg-gray-300');
            heartbeatBtn.classList.remove('bg-gray-200', 'hover:bg-gray-300');
            heartbeatBtn.classList.add('bg-primary', 'text-white');
            messageInput.disabled = true;
            messageInput.placeholder = '心跳消息不需要输入内容';
        }
    }

    // 切换连接状态
    function toggleConnection() {
        if (isConnected) {
            disconnect();
        } else {
            connect();
        }
    }

    // 连接到WebSocket服务器
    function connect() {
        const url = wsUrlInput.value.trim();

        if (!url) {
            addLog('错误', '请输入WebSocket地址', 'error');
            return;
        }

        try {
            websocket = new WebSocket(url);

            websocket.onopen = function() {
                isConnected = true;
                updateConnectionStatus(true);
                addLog('连接', `已连接到 ${url}`, 'success');

                // 如果启用自动心跳，开始发送
                if (autoHeartbeatCheckbox.checked) {
                    startAutoHeartbeat();
                }
            };

            websocket.onmessage = function(event) {
                // 处理接收到的消息
                handleReceivedMessage(event.data);
            };

            websocket.onerror = function(error) {
                addLog('错误', `WebSocket错误: ${error}`, 'error');
            };

            websocket.onclose = function(event) {
                isConnected = false;
                updateConnectionStatus(false);
                stopAutoHeartbeat();
                addLog('断开', `连接已关闭 (代码: ${event.code}, 原因: ${event.reason})`, 'warning');
            };
        } catch (e) {
            addLog('错误', `连接失败: ${e.message}`, 'error');
        }
    }

    // 断开连接
    function disconnect() {
        if (websocket) {
            websocket.close(1000, '客户端主动断开');
            websocket = null;
        }
    }

    // 发送消息
    function sendMessage() {
        if (!isConnected || !websocket) {
            addLog('错误', '未连接到服务器', 'error');
            return;
        }

        try {
            let message;

            if (currentMessageType === 'text') {
                const text = messageInput.value.trim();
                if (!text) {
                    addLog('错误', '消息内容不能为空', 'error');
                    return;
                }

                // 创建文本消息
                message = {
                    text: text,
                    userId: userIdInput.value.trim(),
                    toUserId: targetUserIdInput.value.trim(),
                    compressType: parseInt(compressTypeSelect.value),
                    codecType: parseInt(codecTypeSelect.value),
                    messageType: MESSAGE_TYPE.TEXT
                };

                addLog('发送', `发送文本消息到 ${message.toUserId}: ${message.text}`, 'send');
                messageInput.value = '';
            } else {
                // 创建心跳消息
                message = {
                    messageType: MESSAGE_TYPE.PING,
                    compressType: COMPRESS_TYPE.NONE,
                    codecType: CODEC_TYPE.JSON,
                    userId: userIdInput.value.trim()
                };

                addLog('发送', '发送心跳消息', 'send');
            }

            // 发送消息 (实际项目中可能需要根据codecType进行序列化)
            websocket.send(JSON.stringify(message));
        } catch (e) {
            addLog('错误', `发送消息失败: ${e.message}`, 'error');
        }
    }

    // 处理接收到的消息
    function handleReceivedMessage(data) {
        try {
            const message = JSON.parse(data);

            if (message.messageType === MESSAGE_TYPE.PING) {
                addLog('接收', '收到Ping消息', 'receive');
                // 如果收到Ping，自动回复Pong
                const pongMessage = {
                    messageType: MESSAGE_TYPE.PONG,
                    compressType: COMPRESS_TYPE.NONE,
                    codecType: CODEC_TYPE.JSON,
                    userId: userIdInput.value.trim()
                };
                websocket.send(JSON.stringify(pongMessage));
                addLog('发送', '自动回复Pong消息', 'send');
            } else if (message.messageType === MESSAGE_TYPE.PONG) {
                addLog('接收', '收到Pong消息', 'receive');
            } else if (message.messageType === MESSAGE_TYPE.TEXT) {
                addLog('接收', `收到来自 ${message.userId} 的消息: ${message.text}`, 'receive');
            } else {
                addLog('接收', `收到未知类型消息: ${JSON.stringify(message)}`, 'receive');
            }
        } catch (e) {
            addLog('接收', `收到原始消息: ${data}`, 'receive');
            console.error('解析消息失败:', e);
        }
    }

    // 添加日志
    function addLog(type, content, logType = 'info') {
        const logElement = document.createElement('div');
        const timestamp = new Date().toLocaleTimeString();

        let bgClass, iconClass;

        switch (logType) {
            case 'success':
                bgClass = 'bg-green-50 border-green-200';
                iconClass = 'text-green-500';
                break;
            case 'error':
                bgClass = 'bg-red-50 border-red-200';
                iconClass = 'text-red-500';
                break;
            case 'warning':
                bgClass = 'bg-yellow-50 border-yellow-200';
                iconClass = 'text-yellow-500';
                break;
            case 'send':
                bgClass = 'bg-blue-50 border-blue-200 ml-auto';
                iconClass = 'text-blue-500';
                break;
            case 'receive':
                bgClass = 'bg-purple-50 border-purple-200';
                iconClass = 'text-purple-500';
                break;
            default:
                bgClass = 'bg-gray-50 border-gray-200';
                iconClass = 'text-gray-500';
        }

        logElement.className = `p-3 rounded-lg border shadow-sm max-w-full ${bgClass} flex items-start`;
        logElement.innerHTML = `
                <i class="fa fa-${getIconForType(type)} ${iconClass} mt-1 mr-3"></i>
                <div>
                    <div class="text-xs text-gray-500">${timestamp}</div>
                    <div class="text-sm">${content}</div>
                </div>
            `;

        // 清除"无消息"提示
        if (messageLogs.querySelector('.italic')) {
            messageLogs.innerHTML = '';
        }

        messageLogs.appendChild(logElement);
        messageLogs.scrollTop = messageLogs.scrollHeight;
    }

    // 根据日志类型获取图标
    function getIconForType(type) {
        switch (type) {
            case '连接': return 'plug';
            case '断开': return 'unplug';
            case '发送': return 'paper-plane-o';
            case '接收': return 'inbox';
            case '错误': return 'exclamation-circle';
            default: return 'info-circle';
        }
    }

    // 清空日志
    function clearLogs() {
        messageLogs.innerHTML = `
                <div class="text-gray-500 text-sm italic text-center">
                    消息日志已清空
                </div>
            `;
    }

    // 更新连接状态显示
    function updateConnectionStatus(connected) {
        if (connected) {
            statusIndicator.className = 'w-3 h-3 rounded-full bg-green-500 mr-2';
            statusText.textContent = '已连接';
            connectBtn.innerHTML = '<i class="fa fa-unplug mr-1"></i>断开';
            connectBtn.classList.remove('bg-primary');
            connectBtn.classList.add('bg-red-500', 'hover:bg-red-600');
            sendBtn.disabled = false;
            sendBtn.classList.remove('bg-gray-300', 'text-gray-500', 'cursor-not-allowed');
            sendBtn.classList.add('bg-primary', 'hover:bg-primary/90', 'text-white');
        } else {
            statusIndicator.className = 'w-3 h-3 rounded-full bg-red-500 mr-2';
            statusText.textContent = '未连接';
            connectBtn.innerHTML = '<i class="fa fa-plug mr-1"></i>连接';
            connectBtn.classList.remove('bg-red-500', 'hover:bg-red-600');
            connectBtn.classList.add('bg-primary', 'hover:bg-primary/90');
            sendBtn.disabled = true;
            sendBtn.classList.remove('bg-primary', 'hover:bg-primary/90', 'text-white');
            sendBtn.classList.add('bg-gray-300', 'text-gray-500', 'cursor-not-allowed');
        }
    }

    // 开始自动发送心跳
    function startAutoHeartbeat() {
        if (heartbeatInterval) {
            clearInterval(heartbeatInterval);
        }

        // 每30秒发送一次心跳
        heartbeatInterval = setInterval(() => {
            if (isConnected) {
                const originalType = currentMessageType;
                currentMessageType = 'heartbeat';
                sendMessage();
                currentMessageType = originalType;
            }
        }, 30000);

        addLog('系统', '已启动自动心跳 (30秒间隔)', 'info');
    }

    // 停止自动发送心跳
    function stopAutoHeartbeat() {
        if (heartbeatInterval) {
            clearInterval(heartbeatInterval);
            heartbeatInterval = null;
            addLog('系统', '已停止自动心跳', 'info');
        }
    }

    // 切换自动心跳
    function toggleAutoHeartbeat() {
        if (autoHeartbeatCheckbox.checked && isConnected) {
            startAutoHeartbeat();
        } else {
            stopAutoHeartbeat();
        }
    }

    // 初始化
    document.addEventListener('DOMContentLoaded', () => {
        initEventListeners();
        setMessageType('text');
    });
</script>
</body>
</html>
